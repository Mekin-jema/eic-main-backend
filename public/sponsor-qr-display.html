<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Attendee Page QR Code</title>
        <style>
            body {
                font-family: Arial, sans-serif;
                display: flex;
                flex-direction: column;
                align-items: center;
                justify-content: center;
                min-height: 100vh;
                margin: 0;
                background-color: #f5f5f5;
            }
            .container {
                background: white;
                padding: 2rem;
                border-radius: 10px;
                box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
                text-align: center;
                max-width: 500px;
            }
            h1 {
                color: #333;
                margin-bottom: 1rem;
            }
            .qr-code {
                margin: 1rem 0;
            }
            .url {
                color: #666;
                font-size: 0.9rem;
                word-break: break-all;
                margin-top: 1rem;
            }
            .instructions {
                background: #e8f4fd;
                padding: 1rem;
                border-radius: 5px;
                margin-top: 1rem;
                font-size: 0.9rem;
            }
        </style>
    </head>
    <body>
        <div class="container">
            <h1>Attendee Page QR Code</h1>
            <div class="qr-code">
                <img src="attendee-qr-code.png" alt="QR Code for Attendee Page" style="max-width: 300px; height: auto" />
            </div>
            <div class="url"><strong>URL:</strong> https://green-energy.powerethio.com/attendee</div>
            <div class="instructions">
                <strong>Instructions:</strong><br />
                • Scan this QR code with any smartphone camera or QR code scanner<br />
                • It will automatically redirect to the attendee page<br />
                • You can print this QR code for offline use
            </div>
        </div>
    </body>
</html>
